<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Task Manager</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/styles.css'>
    <script src='js/app.js'></script>
</head>
<body>
    <main>
    <!--Aqui empieza el gestor de categorias-->

        <h1>Gestor de categorias</h1>

        <form id="category-form" class="my-form">

            <label for="id" class="field">
                <span><span class="req-field">*</span> category id:</span>
                <input type="hidden" id="category-id" name="id">
            </label>

            <label for="name" class="field">
                <span><span class="req-field">*</span> name:</span>
                <input type="text" id="category-name" placeholder="Nombre de la categoría" required>
            </label>

            <label for="user_id" class="field">
                <input type="number" id="category-user-id">
            </label>

            <button type="submit">Enviar</button>
        </form>

        <ul id="category-list">
            
        </ul>
     

    
    
        <h1>Gestor de tareas</h1>

        <form action="server/task/create.php" method="post" class="my-form">

            <label for="title" class="field">
                <span><span class="req-field">*</span> title:</span>
                <input type="text" name="title" placeholder="title" id="title" required/>
            </label>
        
            <label for="description" class="field">
                <span>description:</span>
                <input type="text" name="description" placeholder="description" id="description"/>
            </label>
        
            <label for="due_date" class="field">
                <span>release date:</span>
                <input type="date" name="due_date" placeholder="due_date" id="due_date"/>
            </label>
        
            <label for="complete" class="field cbx-g">
                <span>is complete?</span>
                <input type="checkbox" name="complete" id="complete" value="1"/>
            </label>
        
            <label for="user_id" class="field">
                <span><span class="req-field">*</span> user id:</span>
                <input type="number" name="user_id" placeholder="user_id" id="user_id" required/>
            </label>
        
            <label for="category_id" class="field">
                <span><span class="req-field">*</span> category id:</span>
                <input type="number" name="category_id" placeholder="category_id" id="category_id" required/>
            </label>
        
            <button type="submit">Enviar</button>
        </form>
        
        <ul id="task-list">
            <!-- Aquí aparecerán las tareas -->
        </ul>
        
    </main> 
</body>
</html>
